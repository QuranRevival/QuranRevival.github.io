# PCA J110 step 4: the workflow the QR repository runs to publish QuranRevival BUILT FROM MSA's one source.
# It belongs in QuranRevival/QuranRevival.github.io as .github/workflows/build-from-msa.yml. It is kept here, in
# MSA, so it is reviewed with the build it runs; this copy does not run here (it is not under .github/).
#
# What it does: checks out MSA (public, no password needed) at a given commit, runs
# `node tools/apps/build-app.mjs qr`, and publishes build/qr as QR's site with GitHub Pages.
#
# Every 3 hours (schedule, the Owner 30 Oct 2026) it also rebuilds from MSA's main by itself.
# Since 2 Nov 2026 (the Owner: "Can you make it auto?", PCA J86): GitHub ran the 3-hourly schedule only every
# 6-7 hours and dropped some runs, so QR fell two releases behind. It now looks EVERY HOUR; a scheduled run
# builds only when MSA main's version differs from what quranrevival.github.io serves, so most runs take seconds.
#
# Turning it on (step 5, after the Owner has looked at the built QR side by side with today's):
#   QR repository → Settings → Pages → Source: "GitHub Actions", then run this workflow.
# THE WAY BACK (minutes): Settings → Pages → Source: "Deploy from a branch", main, / (root). Today's frozen QR
#   files are still on QR's main branch, untouched, so the address serves them again.
# Before the switch: quranrevival.github.io must be in Firebase Authentication's authorised domains (Owner), and
#   the MSA version built must be v11.39 or later (the build refuses less once qr.json says "live").

name: build-from-msa

on:
  workflow_dispatch:
    inputs:
      msa_ref:
        description: "MSA commit or branch to build (default: main)"
        required: false
        default: "main"
  # The Owner, 30 Oct 2026: QR updates itself from MSA's main (at :17, off the busy :00).
  # 2 Nov 2026 (PCA J86): every hour, because GitHub delays and drops scheduled runs; the check job skips
  # the build when QR already serves MSA main's version. A scheduled run has no inputs, so the checkout
  # below falls back to main.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.v.outputs.go }}
    steps:
      - id: v
        name: Build only if QR is behind MSA main (a run started by hand always builds)
        run: |
          set -u
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          ver() { curl -fsSL --retry 3 "$1" | grep -o 'APP_VERSION = "[0-9.]*"' | head -1 | grep -o '[0-9][0-9.]*' || true; }
          msa=$(ver "https://raw.githubusercontent.com/Madrasatul-Muslimeen/Madrasatul-Muslimeen.github.io/main/app/js/version.js?t=$(date +%s)")
          qr=$(ver "https://quranrevival.github.io/app/js/qr-version.js?t=$(date +%s)")
          echo "MSA main: ${msa:-unknown} · QR live: ${qr:-unknown}"
          if [ -n "$msa" ] && [ "$msa" = "$qr" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out MSA's one source
        uses: actions/checkout@v4
        with:
          repository: Madrasatul-Muslimeen/Madrasatul-Muslimeen.github.io
          ref: ${{ inputs.msa_ref || 'main' }}
          path: msa
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove MSA's source still builds MSA unchanged, then build QR
        working-directory: msa
        run: |
          set -euo pipefail
          node tools/apps/apps-build-check.mjs
          node tools/apps/build-app.mjs qr --out=../_site
          echo "Built from MSA $(git rev-parse --short HEAD), version $(grep -o 'APP_VERSION = "[0-9.]*"' app/js/version.js)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
