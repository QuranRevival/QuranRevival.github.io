<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuranRevival</title>
<style>
:root{--bg:#f7f5ef;--fg:#1f2a24;--muted:#5b6a60;--accent:#1f6f50}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--fg:#e8efe9;--muted:#9fb0a5;--accent:#6fcf9f}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center;box-sizing:border-box}
h1{margin:0 0 8px;font-size:2rem;color:var(--accent)}
p{margin:4px 0;color:var(--muted);max-width:32rem}
a{color:var(--accent)}
.card{display:flex;align-items:center;gap:14px;margin-top:20px;min-height:56px;padding:12px 18px;border-radius:14px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 7%,var(--bg));text-decoration:none;color:var(--fg);max-width:22rem;width:100%;box-sizing:border-box;text-align:left}
.card:hover,.card:focus-visible{border-color:var(--accent)}
.card img{width:40px;height:40px;border-radius:10px;flex:0 0 auto}
.card b{display:block;color:var(--accent)}
.card small{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>QuranRevival</h1>
<p>Quran Study · Asma ul Husna · Learn Deen On-the-Go</p>
<p>Coming here soon, in shā’ Allāh. Until then, please use <a href="https://madrasatul-muslimeen.github.io/">the current app</a>.</p>
<a class="card" href="app/asma.html"><img src="app/img/asma-icon-192.png" alt=""><span><b>Asma ul Husna →</b><small>The 99 Names of Allah. No sign-in.</small></span></a>
</main>
</body>
</html>
